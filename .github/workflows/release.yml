name: Release source
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check tag matches package version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag/version mismatch' }
      - run: npm test
      - run: npm run check
      - shell: powershell
        run: .\tests\mutex.test.ps1
      - shell: powershell
        run: .\tests\restore.test.ps1
      - run: npm run package
      - name: Publish archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(Get-ChildItem dist -File | ForEach-Object FullName)
          gh release create $env:GITHUB_REF_NAME @files --title "Codex Wallpaper $env:GITHUB_REF_NAME" --notes-file CHANGELOG.md --prerelease --verify-tag
